<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1013">
<title>Registro — 書類スキャン</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23F6F7F5'/%3E%3Cpath d='M20 20h20M20 20v20M80 20H60M80 20v20M20 80h20M20 80V60M80 80H60M80 80V60' stroke='%2300A6A6' stroke-width='8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ============ ① ホーム画面 ============ -->
  <section id="screen-home" class="screen active" data-screen="home">
    <header class="home-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M6 6h9M6 6v9M34 6h-9M34 6v9M6 34h9M6 34v-9M34 34h-9M34 34v-9" />
        </svg>
        <span class="brand-name">Registro</span>
      </div>
      <p class="brand-tagline">紙の書類を、まっすぐスキャン。</p>
    </header>

    <div class="home-primary">
      <button id="btn-start-scan" class="btn-primary btn-huge">
        <svg viewBox="0 0 24 24" class="icon-scan" aria-hidden="true">
          <path d="M4 4h4M4 4v4M20 4h-4M20 4v4M4 20h4M4 20v-4M20 20h-4M20 20v-4"/>
          <circle cx="12" cy="12" r="3.2"/>
        </svg>
        書類をスキャン
      </button>
      <label for="file-fallback-home" class="btn-ghost">
        写真から読み込む
      </label>
      <input type="file" id="file-fallback-home" accept="image/*" hidden>
    </div>

    <div class="home-history">
      <div class="history-head">
        <h2>スキャン履歴</h2>
        <span id="history-count" class="mono-tag">0件</span>
      </div>
      <div id="history-empty" class="history-empty">
        <p>まだスキャンがありません。<br>最初の書類をスキャンしてみましょう。</p>
      </div>
      <div id="history-grid" class="history-grid"></div>
    </div>
  </section>

  <!-- ============ ② カメラ画面 ============ -->
  <section id="screen-camera" class="screen" data-screen="camera">
    <div class="camera-stage">
      <video id="camera-video" playsinline muted autoplay></video>
      <canvas id="detect-overlay"></canvas>

      <div id="camera-permission" class="camera-message hidden">
        <svg viewBox="0 0 24 24" class="icon-warning" aria-hidden="true">
          <path d="M12 3 2 20h20L12 3Z"/>
          <path d="M12 10v4M12 17h.01"/>
        </svg>
        <p id="camera-message-text">カメラへのアクセスが許可されていません。</p>
        <label for="file-fallback-camera" class="btn-secondary">写真を選択する</label>
        <input type="file" id="file-fallback-camera" accept="image/*" hidden>
      </div>

      <div id="camera-loading" class="camera-message">
        <div class="spinner-brackets" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <p>検出エンジンを準備中…</p>
      </div>

      <div class="camera-top-bar">
        <button id="btn-camera-close" class="icon-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <span id="detect-status" class="mono-tag detect-status">書類を探しています…</span>
        <label for="file-fallback-camera2" class="icon-btn" aria-label="写真を選択">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>
        </label>
        <input type="file" id="file-fallback-camera2" accept="image/*" hidden>
      </div>
    </div>

    <div class="camera-controls">
      <div class="page-count-pill" id="page-count-pill" hidden>
        <span class="mono-tag" id="page-count-text">1ページ目</span>
      </div>
      <button id="btn-capture" class="shutter-btn" aria-label="撮影">
        <span class="shutter-ring"></span>
      </button>
    </div>
  </section>

  <!-- ============ ②.5 四隅調整画面 ============ -->
  <section id="screen-corners" class="screen" data-screen="corners">
    <div class="corners-stage">
      <canvas id="corners-canvas"></canvas>
    </div>
    <div class="corners-help">
      <p>四隅の点をドラッグして範囲を調整できます</p>
    </div>
    <div class="bottom-actions">
      <button id="btn-corners-retake" class="btn-secondary">再撮影</button>
      <button id="btn-corners-confirm" class="btn-primary">この範囲で切り抜く</button>
    </div>
  </section>

  <!-- ============ ③ 撮影後確認画面 ============ -->
  <section id="screen-review" class="screen" data-screen="review">
    <div class="review-stage">
      <canvas id="review-canvas"></canvas>
    </div>

    <div class="review-panel">
      <div class="filter-row">
        <button class="filter-chip active" data-filter="color">
          <span class="chip-swatch swatch-color"></span>カラー
        </button>
        <button class="filter-chip" data-filter="gray">
          <span class="chip-swatch swatch-gray"></span>グレー
        </button>
        <button class="filter-chip" data-filter="bw">
          <span class="chip-swatch swatch-bw"></span>白黒
        </button>
      </div>

      <div class="slider-group">
        <label class="slider-row">
          <span>明るさ</span>
          <input type="range" id="slider-brightness" min="-60" max="60" value="0">
        </label>
        <label class="slider-row">
          <span>コントラスト</span>
          <input type="range" id="slider-contrast" min="-60" max="60" value="0">
        </label>
      </div>
    </div>

    <div class="bottom-actions three">
      <button id="btn-review-retake" class="btn-secondary">再撮影</button>
      <button id="btn-review-addpage" class="btn-secondary">ページを追加</button>
      <button id="btn-review-done" class="btn-primary">完了</button>
    </div>
  </section>

  <!-- ============ ④ 複数ページ確認画面 ============ -->
  <section id="screen-pages" class="screen" data-screen="pages">
    <header class="pages-header">
      <button id="btn-pages-back" class="icon-btn" aria-label="戻る">
        <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <h2>スキャン結果</h2>
      <span id="pages-count-tag" class="mono-tag">0ページ</span>
    </header>

    <p class="pages-hint">長押しでドラッグすると並べ替えできます</p>
    <div id="pages-list" class="pages-list"></div>

    <button id="btn-pages-addmore" class="btn-ghost btn-block">
      <svg viewBox="0 0 24 24" class="icon-plus"><path d="M12 5v14M5 12h14"/></svg>
      ページを追加でスキャン
    </button>

    <div class="save-section">
      <h3>保存する</h3>
      <div class="save-grid">
        <button id="btn-save-pdf" class="save-btn">
          <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
          <span>PDFで保存</span>
        </button>
        <button id="btn-save-jpeg" class="save-btn">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>
          <span>JPEGで保存</span>
        </button>
        <button id="btn-save-png" class="save-btn">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>
          <span>PNGで保存</span>
        </button>
      </div>
      <p class="save-note" id="save-note"></p>
    </div>
  </section>

  <!-- トースト通知 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

</div>

<canvas id="work-canvas" hidden></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://docs.opencv.org/4.8.0/opencv.js" async></script>
<script src="js/storage.js" defer></script>
<script src="js/detector.js" defer></script>
<script src="js/filters.js" defer></script>
<script src="js/pdfExport.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
